services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    Codewithkyrian\ChromaDB\Factory:
        factory: ['Codewithkyrian\ChromaDB\ChromaDB', 'factory']
        calls:
            - withHost: ['%env(CHROMADB_HOST)%']

    Codewithkyrian\ChromaDB\Client:
        factory: ['@Codewithkyrian\ChromaDB\Factory', 'connect']

    Symfony\AI\Store\Document\Vectorizer:
        arguments:
            $platform: '@ai.platform.gemini'
            $model: 'gemini-embedding-001'

    Symfony\AI\Store\Retriever:
        arguments:
            $store: '@ai.store.chromadb.default'
            $vectorizer: '@Symfony\AI\Store\Document\Vectorizer'